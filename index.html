<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cert Mint</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; overflow-wrap: anywhere; }
      h1 { font-size: clamp(1.5rem, 6vw, 2rem); }
      /* 16px minimum stops iOS from zooming into inputs */
      input, button { width: 100%; padding: .85rem; margin-top: .6rem; font-size: 16px; min-height: 44px; }
      button { cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status { margin-top: 1rem; word-break: break-all; }
      .addr { font-size: .85rem; word-break: break-all; max-width: 100%; margin: .6rem 0 0; }
      .addr { font-family: ui-monospace, Consolas, monospace; }
      .err { color: #c0392b; }
      @media (max-width: 480px) {
        body { margin: 1.25rem auto; padding: 0 .75rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
